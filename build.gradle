def sha1For = { File file ->
    if (!file.exists()) {
        throw new GradleException("Requested SHA-1 for missing file: ${file}")
    }
    def digest = MessageDigest.getInstance('SHA-1')
    file.eachByte(8192) { byte[] buffer, int count ->
        digest.update(buffer, 0, count)
    }
    return digest.digest().encodeHex().toString()
}

def downloadFile = { String url, File target, String expectedSha1 = null ->
    if (!target.parentFile.exists()) {
        target.parentFile.mkdirs()
    }
    if (target.exists() && expectedSha1 && sha1For(target).equalsIgnoreCase(expectedSha1)) {
        return
    }
    def connection = new URL(url).openConnection()
    connection.setRequestProperty('User-Agent', 'Fv2j3/1.0 Gradle runtime setup')
    connection.connect()
    def input = connection.getInputStream()
    try {
        target.withOutputStream { out ->
            out << input
        }
    } finally {
        input.close()
    }
    if (expectedSha1) {
        def actualSha1 = sha1For(target)
        if (!actualSha1.equalsIgnoreCase(expectedSha1)) {
            target.delete()
            throw new GradleException("Checksum mismatch for ${target}: expected ${expectedSha1} but found ${actualSha1}")
        }
    }
}

def extractZip = { File zipFile, File destination ->
    if (!zipFile.exists()) {
        throw new GradleException("Native archive missing: ${zipFile}")
    }
    destination.mkdirs()
    def zip = new ZipFile(zipFile)
    try {
        zip.entries().each { entry ->
            if (entry.directory) {
                return
            }
            def extracted = new File(destination, entry.name)
            extracted.parentFile?.mkdirs()
            extracted.withOutputStream { output ->
                output << zip.getInputStream(entry)
            }
        }
    } finally {
        zip.close()
    }
}

def libraryAllowed = { Map lib ->
    def rules = lib?.rules
    if (!rules) {
        return true
    }
    def current = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    def matched = false
    def allowed = true
    for (rule in rules) {
        def os = rule.os
        if (!os) {
            continue
        }
        def key = os.name?.toLowerCase(Locale.ROOT)
        if (key && current.contains(key)) {
            matched = true
            allowed = 'allow'.equals(rule.action)
            break
        }
    }
    return !matched || allowed
}

def nativeClassifierForCurrentPlatform = {
    def os = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    def arch = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
    if (os.contains('win')) {
        return 'natives-windows'
    }
    if (os.contains('mac')) {
        return 'natives-osx'
    }
    if (os.contains('linux')) {
        return arch.contains('64') ? 'natives-linux' : 'natives-linux'
    }
    return 'natives-linux'
}

tasks.register('prepareMinecraftRuntime') {
    group = 'build'
    description = 'Downloads and prepares the official vanilla Minecraft 1.12.2 runtime.'

    doLast {
        def home = file(minecraftRuntimeHome.get())
        def versionDir = new File(home, "versions/${minecraftVersion}")
        versionDir.mkdirs()

        def manifest = new JsonSlurper().parse(new URL(minecraftManifestUrl).openStream())
        def versionEntry = manifest.versions.find { it.id == minecraftVersion }
        if (!versionEntry) {
            throw new GradleException("Official Minecraft version ${minecraftVersion} was not found in the Mojang version manifest.")
        }

        def versionJsonFile = new File(versionDir, "${minecraftVersion}.json")
        downloadFile(versionEntry.url, versionJsonFile)
        def versionJson = new JsonSlurper().parse(versionJsonFile)

        def clientDownload = versionJson.downloads?.client
        if (!clientDownload?.url) {
            throw new GradleException("Minecraft 1.12.2 client download metadata is missing from the official version JSON.")
        }
        def clientJar = new File(versionDir, "${minecraftVersion}.jar")
        downloadFile(clientDownload.url, clientJar, clientDownload.sha1)

        def serverDownload = versionJson.downloads?.server
        if (serverDownload?.url) {
            def serverJar = new File(versionDir, "minecraft_server.jar")
            downloadFile(serverDownload.url, serverJar, serverDownload.sha1)
        }

        def librariesDir = new File(home, 'libraries')
        librariesDir.mkdirs()
        for (lib in versionJson.libraries ?: []) {
            if (!libraryAllowed(lib)) {
                continue
            }
            def artifact = lib.downloads?.artifact
            if (artifact?.url) {
                def path = artifact.path ?: new File(new URL(artifact.url).path).name
                def localFile = new File(home, path)
                localFile.parentFile?.mkdirs()
                downloadFile(artifact.url, localFile, artifact.sha1)
            }
            def classifier = nativeClassifierForCurrentPlatform()
            def nativeArtifact = lib.downloads?.classifiers?[(classifier)]
            if (nativeArtifact?.url) {
                def localFile = new File(home, nativeArtifact.path)
                localFile.parentFile?.mkdirs()
                downloadFile(nativeArtifact.url, localFile, nativeArtifact.sha1)
                if (localFile.name.endsWith('.zip') || localFile.name.endsWith('.jar')) {
                    def nativesDir = new File(home, "versions/${minecraftVersion}/natives")
                    extractZip(localFile, nativesDir)
                }
            }
        }

        def assetIndex = versionJson.assetIndex
        if (assetIndex?.url) {
            def assetIndexFile = new File(home, "assets/indexes/${assetIndex.id}.json")
            assetIndexFile.parentFile.mkdirs()
            downloadFile(assetIndex.url, assetIndexFile, assetIndex.sha1)
        }

        logger.lifecycle("Prepared official vanilla Minecraft 1.12.2 runtime at ${home}")
    }
}

tasks.withType(JavaExec).configureEach {
    def configuredHome = minecraftRuntimeHome.orNull
    if (configuredHome != null && !configuredHome.trim().isEmpty()) {
        systemProperty 'fv2j3.minecraft.home', configuredHome
