    def verificationDirectory = providers.systemProperty('fv2j3.verification.dir').orNull
    if (verificationDirectory != null && !verificationDirectory.trim().isEmpty()) {
        systemProperty 'fv2j3.verification.dir', verificationDirectory
    }
}

ext.bootstrapClasspathFiles = { ->
    def classpathFiles = []
    classpathFiles << project(':loader-runtime').layout.buildDirectory.file('libs/loader-runtime-0.1.0-SNAPSHOT.jar').get().asFile
    classpathFiles << project(':loader-core').layout.buildDirectory.file('libs/loader-core-0.1.0-SNAPSHOT.jar').get().asFile
    classpathFiles << project(':loader-api').layout.buildDirectory.file('libs/loader-api-0.1.0-SNAPSHOT.jar').get().asFile
    classpathFiles << project(':minecraft-compat').layout.buildDirectory.file('libs/minecraft-compat-0.1.0-SNAPSHOT.jar').get().asFile
    classpathFiles << project(':mesrgl-integration').layout.buildDirectory.file('libs/mesrgl-integration-0.1.0-SNAPSHOT.jar').get().asFile

    def gradleUserHome = gradle.gradleUserHomeDir
    def jacksonDatabind = file("${gradleUserHome}/caches/modules-2/files-2.1/com.fasterxml.jackson.core/jackson-databind/2.17.2/e6deb029e5901e027c129341fac39e515066b68c/jackson-databind-2.17.2.jar")
    def jacksonCore = file("${gradleUserHome}/caches/modules-2/files-2.1/com.fasterxml.jackson.core/jackson-core/2.17.2/969a35cb35c86512acbadcdbbbfb044c877db814/jackson-core-2.17.2.jar")
    def jacksonAnnotations = file("${gradleUserHome}/caches/modules-2/files-2.1/com.fasterxml.jackson.core/jackson-annotations/2.17.2/147b7b9412ffff24339f8aba080b292448e08698/jackson-annotations-2.17.2.jar")
    def asmJar = file("${gradleUserHome}/caches/modules-2/files-2.1/org.ow2.asm/asm/9.8/dc19ecb3f7889b7860697215cae99c0f9b6f6b4b/asm-9.8.jar")

    if (jacksonDatabind.exists()) classpathFiles << jacksonDatabind
    if (jacksonCore.exists()) classpathFiles << jacksonCore
    if (jacksonAnnotations.exists()) classpathFiles << jacksonAnnotations
    if (asmJar.exists()) classpathFiles << asmJar

    return classpathFiles.findAll { it.exists() }
}

tasks.register('runClient', JavaExec) {
    group = 'Fv2j3'
    description = 'Launches the real Minecraft 1.12.2 Client with Fv2j3 loader. Uses runs/client as game directory.'

    dependsOn ':loader-runtime:assemble', ':loader-runtime:testModJar', 'prepareMinecraftRuntime', 'cleanTestWorld'

    doFirst {
        def runtimeHome = file(minecraftRuntimeHome.get())
        def runDir = file("${rootDir}/runs/client")
        def modsDir = file("${runDir}/mods")
        def verificationDir = file("${rootDir}/build/fv2j3-verification")
        runDir.mkdirs()
        modsDir.mkdirs()
        verificationDir.mkdirs()
        def testModJar = project(':loader-runtime').layout.buildDirectory.file('libs/fv2j3-test-mod.jar').get().asFile
        if (testModJar.exists()) {
            copy {
                from testModJar
                into modsDir
            }
        }
        systemProperty 'fv2j3.minecraft.home', runtimeHome.absolutePath
        systemProperty 'fv2j3.verification.dir', verificationDir.absolutePath
        systemProperty 'fv2j3.launch.target', 'client'
        systemProperty 'fv2j3.mods.dir', modsDir.absolutePath
        // Forward MesrGL integration tuning properties to the game JVM.
        System.properties.findAll { it.key.startsWith('fv2j3.mesrgl.') }.each {
            systemProperty it.key, it.value
        }
        workingDir = runDir
        def bootstrapCp = bootstrapClasspathFiles()
        if (bootstrapClasspathFiles().isEmpty()) {
            throw new GradleException("Bootstrap classpath is empty! JARs not found. Check that loader modules have been built.")
        }
        classpath = files(bootstrapCp)
        mainClass = 'io.github.fv2j3dteam.loader.runtime.ClientBootstrap'
        args = ["--mods=${modsDir.absolutePath}", "--minecraft-home=${runtimeHome.absolutePath}"]
        // MC 1.12.2 needs little heap, but the host machine shares RAM with
        // the IDE/browser/iGPU; a pinned, modest heap keeps GC deterministic
        // instead of relying on late heap expansion under memory pressure.
        maxHeapSize = '2g'
        minHeapSize = '2g'
        jvmArgs '-XX:G1HeapRegionSize=4m', '-XX:+HeapDumpOnOutOfMemoryError', '-XX:HeapDumpPath=/var/tmp'
        standardInput = System.in
        ignoreExitValue = true
        logger.lifecycle('Launching Minecraft 1.12.2 Client with Fv2j3...')
        logger.lifecycle("Minecraft home: ${runtimeHome.absolutePath}")
        logger.lifecycle("Run directory: ${runDir.absolutePath}")
        logger.lifecycle("Mods directory: ${modsDir.absolutePath}")
        logger.lifecycle("Verification directory: ${verificationDir.absolutePath}")
    }
}

tasks.register('runServer', JavaExec) {
    group = 'Fv2j3'
    description = 'Launches the real Minecraft 1.12.2 Dedicated Server with Fv2j3 loader. Uses runs/server as game directory.'

    dependsOn ':loader-runtime:assemble', ':loader-runtime:testModJar', 'prepareMinecraftRuntime', 'cleanTestWorld'

    doFirst {
        def runtimeHome = file(minecraftRuntimeHome.get())
        def runDir = file("${rootDir}/runs/server")
        def modsDir = file("${runDir}/mods")
        def verificationDir = file("${rootDir}/build/fv2j3-server-verification")
        runDir.mkdirs()
        modsDir.mkdirs()
        verificationDir.mkdirs()
        def testModJar = project(':loader-runtime').layout.buildDirectory.file('libs/fv2j3-test-mod.jar').get().asFile
        if (testModJar.exists()) {
            copy {
                from testModJar
                into modsDir
            }
        }
        systemProperty 'fv2j3.minecraft.home', runtimeHome.absolutePath
        systemProperty 'fv2j3.verification.dir', verificationDir.absolutePath
        systemProperty 'fv2j3.launch.target', 'dedicated_server'
        systemProperty 'fv2j3.mods.dir', modsDir.absolutePath
        workingDir = runDir
        classpath = files(bootstrapClasspathFiles())
        // minecraft_server.jar bundles an outdated log4j whose api lacks
        // message classes the game code calls (ReusableSimpleMessage). Put
        // the version-correct log4j on the PARENT loader so parent-first
        // delegation always resolves log4j to the new jars, never the
        // bundled ones.
        def log4jBase = new File(runtimeHome, 'org/apache/logging/log4j')
        def log4jApi = file("${log4jBase}/log4j-api/2.8.1/log4j-api-2.8.1.jar".toString())
        def log4jCore = file("${log4jBase}/log4j-core/2.8.1/log4j-core-2.8.1.jar".toString())
        if (log4jApi.exists() && log4jCore.exists()) {
            classpath += files(log4jApi, log4jCore)
        } else {
            throw new GradleException("log4j 2.8.1 jars missing from the runtime home: " + log4jBase)
        }
        mainClass = 'io.github.fv2j3dteam.loader.runtime.ServerBootstrap'
        args = ["--mods=${modsDir.absolutePath}", "--minecraft-home=${runtimeHome.absolutePath}", "nogui"]
        maxHeapSize = '2g'
        minHeapSize = '2g'
        jvmArgs '-XX:G1HeapRegionSize=4m', '-XX:+HeapDumpOnOutOfMemoryError', '-XX:HeapDumpPath=/var/tmp'
        standardInput = System.in
        ignoreExitValue = true
        logger.lifecycle('Launching Minecraft 1.12.2 Dedicated Server with Fv2j3...')
        logger.lifecycle("Minecraft home: ${runtimeHome.absolutePath}")
        logger.lifecycle("Run directory: ${runDir.absolutePath}")
        logger.lifecycle("Mods directory: ${modsDir.absolutePath}")
        logger.lifecycle("Verification directory: ${verificationDir.absolutePath}")
    }
}

