tasks.register('testMdk') {
    group = 'Fv2j3'
    description = 'Tests the MDK fresh build.'

    dependsOn ':loader-api:assemble'
    doLast {
        def mdkDir = file("${rootDir}/mdk")
        if (!mdkDir.exists()) {
            throw new GradleException("MDK directory not found: ${mdkDir}")
        }
        def gradlew = new File(mdkDir, 'gradlew')
        if (!gradlew.exists()) {
            throw new GradleException("MDK gradlew not found: ${gradlew}")
        }
        def gradleWrapperJar = new File(mdkDir, 'gradle/wrapper/gradle-wrapper.jar')
        if (!gradleWrapperJar.exists()) {
            throw new GradleException("MDK gradle-wrapper.jar not found: ${mdkDir}")
        }
        def exampleMod = new File(mdkDir, 'src/main/java/com/example/mod/ExampleMod.java')
        if (!exampleMod.exists()) {
            throw new GradleException("MDK example mod not found: ${mdkDir}")
        }
        def metadata = new File(mdkDir, 'src/main/resources/META-INF/fv2j3.mod.json')
        if (!metadata.exists()) {
            throw new GradleException("MDK metadata not found: ${mdkDir}")
        }
        logger.lifecycle("MDK structure verified at ${mdkDir}")
        logger.lifecycle("gradlew: present")
        logger.lifecycle("gradlew.bat: " + (new File(mdkDir, 'gradlew.bat').exists() ? "present" : "MISSING"))
        logger.lifecycle("gradle-wrapper.jar: present")
        logger.lifecycle("Example mod: present")
    }
}

tasks.register('buildInstaller', JavaExec) {
    group = 'Fv2j3'
    description = 'Builds the self-contained Fv2j3-Installer.jar (Fat JAR with all Fv2j3 runtime libraries embedded).'

    dependsOn ':loader-api:assemble', ':loader-core:assemble', ':loader-runtime:assemble', ':minecraft-compat:assemble', 'prepareMinecraftRuntime'

    def distributionsDir = file("${rootDir}/build/distributions")
    def shadowJar = file("${rootDir}/installer/build/libs/Fv2j3-Installer.jar")

    doFirst {
        distributionsDir.mkdirs()
    }

    workingDir = file("${rootDir}/installer")
    executable = 'bash'
    args = ['-c', """
        cd "${rootDir}/installer" && "${rootDir}/gradlew" --no-daemon -Pfv2j3Version=${fv2j3Version} -Pfv2j3Group=${fv2j3Group} shadowJar
    """]

    ignoreExitValue = true

    doLast {
        if (!shadowJar.exists()) {
            throw new GradleException("Installer build failed: ${shadowJar} not found.")
        }
        def target = new File(distributionsDir, "Fv2j3-Installer.jar")
        target.bytes = shadowJar.bytes
        logger.lifecycle("")
        logger.lifecycle("BUILD SUCCESSFUL")
        logger.lifecycle("")
        logger.lifecycle("Fv2j3 Installer:")
        logger.lifecycle("  ${target.absolutePath}")
        logger.lifecycle("")
    }
}

// ============================================================
// cleanTestWorld
//
// Wipes the dedicated Fv2j3 test-client Minecraft save directory
// before every test-client startup. This is required for automated
// visual validation: the rendered scene must be deterministic across
// runs, so the test world must begin empty every time.
//
// Safety:
//   - The cleanup target is the same `minecraftRuntimeHome` that
//     `runClient` / `runServer` use, resolved from the same
//     provider (fv2j3.minecraft.home property or build/minecraft-runtime
//     default). If the resolved path is missing or not inside the
//     project tree (and not a system Minecraft install), the task
//     FAILS rather than touching an arbitrary directory.
//   - Only the `saves/` subdirectory of that runtime is removed.
//     mods, config, resourcepacks, assets, libraries, and the MesrGL /
//     Fv2j3 binaries all remain untouched.
//   - There is no JVM startup hook: cleanTestWorld is a Gradle task
//     that the operator invokes explicitly (typically as part of
//     `cleanTestWorld runClient`).
// ============================================================

// The cleaner is invoked as a JavaExec task registered on the
// loader-runtime subproject (so its classpath can see TestWorldCleaner
// + CleanerMain). The root cleanTestWorld task reads the runtime /
// project / user-home paths from the same minecraftRuntimeHome provider
// used by runClient/runServer, stashes them in an ext property on the
// runCleaner task, and the runCleaner doFirst block passes them to the
// child JVM as -D system properties.
// (No subproject JavaExec task is registered any more; the root
// cleanTestWorld spawns the cleaner as a plain subprocess so we can
// inject the resolved paths as -D flags. This avoids the
// "systemProperty after configuration" ordering hazard.)

tasks.register('cleanTestWorld') {
    group = 'Fv2j3'
    description = 'Wipes the Fv2j3 test-client save directory. Use before runClient for deterministic test worlds.'

    dependsOn 'prepareMinecraftRuntime', ':loader-runtime:jar'

    doLast {
        def configuredHome = minecraftRuntimeHome.get()
        if (configuredHome == null || configuredHome.trim().isEmpty()) {
            throw new GradleException("cleanTestWorld: fv2j3.minecraft.home is not set; refusing to guess a game directory.")
        }
        def runtimeHome = file(configuredHome).absoluteFile
        def projectRoot = rootDir.absoluteFile
        def userHome = System.getProperty('user.home') ?: ''

        // Build the classpath: all of loader-runtime's main + loader-api
        // main + minecraft-compat main.
        def loaderRuntimeClasses = project(':loader-runtime').sourceSets.main.output
        def loaderApiClasses = project(':loader-api').sourceSets.main.output
        def minecraftCompatClasses = project(':minecraft-compat').sourceSets.main.output
        def classpath = [
                loaderRuntimeClasses.classesDirs.asPath,
                loaderApiClasses.classesDirs.asPath,
                minecraftCompatClasses.classesDirs.asPath
        ]
        def sep = System.getProperty('path.separator', ':')
        def cp = classpath.join(sep)

        def javaBin = System.getProperty('java.home') + File.separator + 'bin' + File.separator + 'java'
        // Build the command with -D system properties prepended to the JVM
        // args (so the child CleanerMain sees them via System.getProperty).
        def command = [
                javaBin,
                '-Dfv2j3.cleaner.runtimeHome=' + runtimeHome.absolutePath,
                '-Dfv2j3.cleaner.projectRoot=' + projectRoot.absolutePath,
                '-Dfv2j3.cleaner.userHome=' + userHome,
                '-cp', cp,
                'io.github.fv2j3dteam.loader.runtime.CleanerMain'
        ]
        logger.lifecycle("[Fv2j3] Invoking cleaner: ${javaBin} -cp <classpath> io.github.fv2j3dteam.loader.runtime.CleanerMain")
        logger.lifecycle("  runtimeHome = ${runtimeHome.absolutePath}")
        logger.lifecycle("  projectRoot = ${projectRoot.absolutePath}")
        logger.lifecycle("  userHome    = ${userHome}")

        def process = new ProcessBuilder(command)
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        int exit = process.waitFor()
        // Surface the cleaner's stdout in the Gradle log (inheritIO()
        // goes to the JVM's terminal, not Gradle's logger, so we capture).
        def output = process.inputStream.text
        output.eachLine { line -> logger.lifecycle(line) }
        if (exit != 0) {
            throw new GradleException("cleanTestWorld: cleaner exited with code " + exit)
        }
    }
}

// ============================================================
// Push / Publish
//
//   push    — git push the local master branch to origin master.
//             Fails fast if the working tree is dirty (so accidental
//             uncommitted changes never go upstream) or if there is
//             no upstream tracking branch yet.
//
//   publish — depends on buildInstaller (which produces
//             build/distributions/Fv2j3-Installer.jar). Tags the
//             current HEAD with a date-based version (DYYYYMMDD,
//             e.g. D20260907 for 2026-09-07), pushes the tag, and
//             creates a GitHub Release on origin with that tag,
//             uploading the installer JAR as the release asset.
//
//   Versioning rule (per project policy):
//     D + YYYY + MM + DD  →  example: D20260907
//   If today's tag already exists on origin (e.g. publishing twice
//   in one day), pass `-Pfv2j3.publish.tagOverride=DYYYYMMDD-N` to
//   disambiguate.
//
//   Requirements:
//     * gh CLI installed and authenticated (`gh auth status` OK)
//     * git remote `origin` pointing at the GitHub repo
//       (default: Fv2j3DTeam/Fv2j3, overridable via
//       -Pfv2j3.release.repository=owner/repo)
// ============================================================

def resolveReleaseRepository = {
    def repo = providers.gradleProperty('fv2j3.release.repository').orNull
    if (repo != null && !repo.trim().isEmpty()) {
        return repo.trim()
    }
    def proc = ['git', 'config', '--get', 'remote.origin.url'].execute()
    proc.waitFor()
    def url = proc.text?.trim()
    if (url) {
        // Normalize git URLs to owner/repo form for `gh release create`.
        // Accepts:
        //   https://github.com/owner/repo(.git)
        //   git@github.com:owner/repo(.git)
        def m = (url =~ Pattern.compile('github\\.com[:/](.+?)/([^/]+?)(?:\\.git)?/?$'))
        if (m.find()) {
            return "${m.group(1)}/${m.group(2)}"
        }
    }
    return 'Fv2j3DTeam/Fv2j3'
}

def computePublishTag = { String today ->
    def override = providers.gradleProperty('fv2j3.publish.tagOverride').orNull
    if (override != null && !override.trim().isEmpty()) {
        return override.trim()
    }
    return "D${today}"
}

def computeTodayStamp = {
    return new Date().format('yyyyMMdd')
}

tasks.register('push') {
    group = 'Fv2j3'
    description = 'Pushes the local master branch to origin/master. Refuses if the working tree is dirty.'

    doLast {
        // Verify the working tree is clean so accidental uncommitted changes
        // never leak upstream.
        def statusProc = ['git', 'status', '--porcelain'].execute()
        statusProc.waitFor()
        def dirty = statusProc.text?.trim()
        if (dirty) {
            throw new GradleException("Working tree is dirty; refusing to push:\n${dirty}")
        }

        // Make sure a master branch exists locally; if not, fail clearly.
        def branchProc = ['git', 'rev-parse', '--verify', '--quiet', 'master'].execute()
        branchProc.waitFor()
        if (branchProc.exitValue() != 0) {
            throw new GradleException("No local 'master' branch exists. Create one before running 'push'.")
        }

        // Ensure an upstream tracking ref so `git push` does the right thing.
        def upstreamProc = ['git', 'rev-parse', '--abbrev-ref', '--symbolic-full-name', 'master@{u}'].execute()
        upstreamProc.waitFor()
        if (upstreamProc.exitValue() != 0) {
            logger.lifecycle("No upstream tracking branch for master; setting origin/master as upstream.")
            def result = ['git', 'push', '--set-upstream', 'origin', 'master'].execute()
            def output = new StringBuilder()
            def error = new StringBuilder()
            result.waitForProcessOutput(output, error)
            output.toString().eachLine { logger.lifecycle(it) }
            error.toString().eachLine { logger.lifecycle(it) }
            if (result.exitValue() != 0) {
                throw new GradleException("Failed to push and set upstream: ${error}")
            }
        } else {
            def result = ['git', 'push', 'origin', 'master'].execute()
            def output = new StringBuilder()
            def error = new StringBuilder()
            result.waitForProcessOutput(output, error)
            output.toString().eachLine { logger.lifecycle(it) }
            error.toString().eachLine { logger.lifecycle(it) }
            if (result.exitValue() != 0) {
                throw new GradleException("Failed to push: ${error}")
            }
        }
        logger.lifecycle("Pushed master to origin.")
    }
}

tasks.register('publish') {
    group = 'Fv2j3'
    description = 'Builds the installer, tags HEAD with D{YYYYMMDD}, pushes the tag, and creates a GitHub Release with the installer attached.'

    dependsOn 'buildInstaller'

    doLast {
        def installerJar = file("${rootDir}/build/distributions/Fv2j3-Installer.jar")
        if (!installerJar.exists()) {
            throw new GradleException("publish: expected installer at ${installerJar} but it is missing.")
        }

        def repository = resolveReleaseRepository()
        def today = computeTodayStamp()
        def tag = computePublishTag(today)

        // Verify the working tree is clean: a publish must not silently
        // include uncommitted edits.
        def statusProc = ['git', 'status', '--porcelain'].execute()
        statusProc.waitFor()
        def dirty = statusProc.text?.trim()
        if (dirty) {
            throw new GradleException("Working tree is dirty; refusing to publish. Commit/stash first:\n${dirty}")
        }

        // Check tag presence on origin (so we don't blindly re-push an
        // immutable tag).
        def lsRemote = ['git', 'ls-remote', '--tags', 'origin', "refs/tags/${tag}"].execute()
        lsRemote.waitFor()
        if (lsRemote.text?.trim()) {
            throw new GradleException("publish: tag '${tag}' already exists on origin. Pass -Pfv2j3.publish.tagOverride=D{YYYYMMDD}-N to disambiguate.")
        }

        // Create and push the tag locally first (annotated, signed-off-ish).
        exec {
            commandLine 'git', 'tag', '-a', tag, '-m', "Release ${tag} (authored by ${fv2j3Author})"
        }
        try {
            exec {
                commandLine 'git', 'push', 'origin', tag
            }
        } catch (Exception tagPushFailure) {
            // If the push failed (network/auth), roll back the local tag
            // so a retry does not see a stale tag-already-exists error.
            exec {
                commandLine 'git', 'tag', '-d', tag
                ignoreExitValue = true
            }
            throw tagPushFailure
        }

        // Build release notes.
        def notes = "Fv2j3 release ${tag}\n" +
                "Author: ${fv2j3Author}\n" +
                "Group: ${fv2j3Group}\n" +
                "Version: ${fv2j3Version}\n" +
                "Built: ${new Date()}\n" +
                "\n" +
                "Installer: Fv2j3-Installer.jar\n"

        // gh release create: emits the tag, builds the GitHub Release,
        // and uploads the installer as the release asset. --generate-notes
        // asks GitHub to compose a PR-style changelog from merged PRs.
        def notesFile = file("${buildDir}/tmp/release-notes-${tag}.md")
        notesFile.parentFile.mkdirs()
        notesFile.text = notes

        try {
            exec {
                commandLine 'gh', 'release', 'create', tag,
                        '--repo', repository,
                        '--title', "Fv2j3 ${tag}",
                        '--notes-file', notesFile.absolutePath,
                        '--generate-notes',
                        installerJar.absolutePath
            }
        } catch (Exception releaseFailure) {
            // Best-effort cleanup of the just-pushed tag if release creation
            // failed, so the next attempt is clean.
            exec {
                commandLine 'gh', 'release', 'delete', tag, '--repo', repository, '--yes'
                ignoreExitValue = true
            }
            exec {
                commandLine 'git', 'push', 'origin', '--delete', tag
                ignoreExitValue = true
            }
            exec {
                commandLine 'git', 'tag', '-d', tag
                ignoreExitValue = true
            }
            throw releaseFailure
        }

        logger.lifecycle("")
        logger.lifecycle("Publish complete.")
        logger.lifecycle("  Release: https://github.com/${repository}/releases/tag/${tag}")
        logger.lifecycle("  Installer: ${installerJar.absolutePath}")
        logger.lifecycle("")
    }
}
